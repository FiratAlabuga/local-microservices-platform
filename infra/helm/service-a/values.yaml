replicaCount: 1

image:
  repository: ghcr.io/localplatform/service-a
  pullPolicy: IfNotPresent
  tag: "0.1.0"

serviceAccount:
  create: true
  name: "service-a-sa"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  nodePort: 30080

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: order-service.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 200m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 20
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

env:
  SERVER_PORT: "8080"
  DB_URL: "jdbc:postgresql://postgres-order.microservices.svc.cluster.local:5432/orders"
  DB_USERNAME: "orders_user"
  REDIS_HOST: "redis.microservices.svc.cluster.local"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.microservices.svc.cluster.local:9092"

secretEnv:
  DB_PASSWORD:
    secretName: "service-a-secrets"
    key: "db-password"
  REDIS_PASSWORD:
    secretName: "service-a-secrets"
    key: "redis-password"
