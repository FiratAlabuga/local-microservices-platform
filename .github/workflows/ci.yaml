name: CI - Build, Test & Security Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-build-test:
    name: Build & Test (Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Unit & Component Tests
        run: ./gradlew test --no-daemon

      - name: Build Boot JARs
        run: ./gradlew bootJar --no-daemon

  helm-lint-validate:
    name: Helm Lint & Template Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.16.2'

      - name: Lint Service A Chart
        run: helm lint infra/helm/service-a

      - name: Lint Service B Chart
        run: helm lint infra/helm/service-b

      - name: Template Render Service A
        run: helm template service-a infra/helm/service-a -f infra/helm/service-a/values.yaml

      - name: Template Render Service B
        run: helm template service-b infra/helm/service-b -f infra/helm/service-b/values.yaml

  docker-build-scan:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [ java-build-test ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: 'gradle'

      - name: Build Application JARs
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Service A Docker Image
        uses: docker/build-push-action@v6
        with:
          context: services/service-a
          push: false
          tags: service-a:test
          load: true

      - name: Build Service B Docker Image
        uses: docker/build-push-action@v6
        with:
          context: services/service-b
          push: false
          tags: service-b:test
          load: true

      - name: Trivy Vulnerability Scanner (Service A)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'service-a:test'
          format: 'table'
          exit-code: '0' # Non-blocking on initial PR, warns
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
