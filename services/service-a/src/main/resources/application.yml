spring:
  application:
    name: service-a

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/orders}
    username: ${DB_USERNAME:orders_user}
    password: ${DB_PASSWORD:changeme_order_dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:changeme_redis_dev}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          min-idle: 2

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
      acks: all
      retries: 3
      enable.idempotence: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  structured:
    format:
      console: logstash  # Spring Boot 4.x structured logging

app:
  kafka:
    topics:
      order-created: order.created
  cache:
    order-ttl-seconds: ${CACHE_ORDER_TTL_SECONDS:300}
  correlation-id:
    header-name: X-Correlation-Id
