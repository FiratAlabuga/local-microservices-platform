replicaCount: 1

image:
  repository: ghcr.io/localplatform/service-b
  pullPolicy: IfNotPresent
  tag: "0.1.0"

serviceAccount:
  create: true
  name: "service-b-sa"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8081
  nodePort: 30081

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 200m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8081
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8081
  initialDelaySeconds: 20
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

env:
  SERVER_PORT: "8081"
  DB_URL: "jdbc:postgresql://postgres-notification.microservices.svc.cluster.local:5432/notifications"
  DB_USERNAME: "notifications_user"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.microservices.svc.cluster.local:9092"
  KAFKA_CONSUMER_GROUP: "notification-service"

secretEnv:
  DB_PASSWORD:
    secretName: "service-b-secrets"
    key: "db-password"
