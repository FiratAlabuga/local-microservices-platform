name: Release & GHCR Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: 'gradle'

      - name: Build Spring Boot JARs
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Service A Image
        uses: docker/build-push-action@v6
        with:
          context: services/service-a
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/service-a:${{ steps.version.outputs.TAG }}
            ghcr.io/${{ github.repository }}/service-a:latest

      - name: Build and Push Service B Image
        uses: docker/build-push-action@v6
        with:
          context: services/service-b
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/service-b:${{ steps.version.outputs.TAG }}
            ghcr.io/${{ github.repository }}/service-b:latest

      - name: Update GitOps Helm Values with New Tag
        run: |
          NEW_TAG="${{ steps.version.outputs.TAG }}"
          sed -i "s/tag: .*/tag: \"${NEW_TAG}\"/" infra/helm/service-a/values.yaml
          sed -i "s/tag: .*/tag: \"${NEW_TAG}\"/" infra/helm/service-b/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/helm/service-a/values.yaml infra/helm/service-b/values.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(gitops): update image tag to ${NEW_TAG}" && git push origin main)
