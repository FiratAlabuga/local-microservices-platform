kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: microservices-local
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  # Ingress HTTP
  - containerPort: 80
    hostPort: 8085
    protocol: TCP
  # Ingress HTTPS
  - containerPort: 443
    hostPort: 8445
    protocol: TCP
  # Direct NodePort for Service A
  - containerPort: 30080
    hostPort: 30080
    protocol: TCP
  # Direct NodePort for Service B
  - containerPort: 30081
    hostPort: 30081
    protocol: TCP
